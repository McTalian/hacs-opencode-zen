[project]
name = "hacs-opencode-zen"
version = "0.1.6"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::pytest.PytestRemovedIn9Warning",
]

[dependency-groups]
test = [
    "homeassistant>=2026.6.0",
    "hassil>=2.0.0",
    "openai>=2.21.0,<3.0.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "home_assistant_intents",
    "PyTurboJPEG>=2.5.0",
]
